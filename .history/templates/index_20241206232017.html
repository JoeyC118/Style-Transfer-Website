<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Transfer</title>
</head>
<body>
    <h1>Style Your Images!</h1>

    <form id="styleForm" action="/" method="POST" enctype="multipart/form-data"> 
        <label for="dropdown">Choose a style:</label>
        <select id="dropdown" name="options" required>
            <option value="" disabled selected>Select a style</option>
            <option value="option1">Style 1</option>
            <option value="option2">Style 2</option>
            <option value="option3">Style 3</option>
        </select>
        <br><br>

        <label for="content_image">Upload Content Image:</label>
        <input type="file" name="content_image" required><br><br>

        <button type="submit">Start Styling!</button>
    </form>

    {% if styled_image %}
        <h2>Styled Image:</h2>
        <img src="{{ styled_image }}" alt="Styled Image">
    {% endif %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('styleForm');
            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const dropdown = document.getElementById('dropdown');
                if (!dropdown.value) {
                    alert('Please select a style.');
                    return;
                }

                const fileInput = document.querySelector('input[name="content_image"]');
                if (!fileInput.files.length) {
                    alert('Please upload a content image.');
                    return;
                }

                const formData = new FormData(form);
                console.log([...formData.entries()]); // Debugging: Log form data

                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(data => {
                    console.log('Response received:', data); // Log the response
                })
                .catch(error => console.error('Error:', error));
            });
        });
    </script>
</body>
</html>
