<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Transfer</title>
</head>
<body>
    <h1>Style Your Images!</h1>

    <form id="styleForm" action="/" method="POST" enctype="multipart/form-data">
        <label for="dropdown">Choose a style:</label>
        <select id="dropdown" name="options" required>
            <option value="" disabled selected>Select a style</option>
            <option value="option1">Style 1</option>
            <option value="option2">Style 2</option>
            <option value="option3">Style 3</option>
        </select>
        <br><br>

        <label for="content_image">Upload Content Image:</label>
        <input type="file" id="content_image" name="content_image" accept="image/*" required><br><br>

        <button type="submit">Start Styling!</button>
    </form>

    {% if styled_image %}
        <h2>Styled Image:</h2>
        <img src="{{ styled_image }}" alt="Styled Image">
    {% endif %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('styleForm');
            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const dropdown = document.getElementById('dropdown');
                if (!dropdown.value) {
                    alert('Please select a style.');
                    return;
                }

                const fileInput = document.getElementById('content_image');
                if (!fileInput.files.length) {
                    alert('Please upload a content image.');
                    return;
                }

                const formData = new FormData(form);

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }

                    const data = await response.json(); // Assuming backend returns JSON
                    console.log('Response received:', data);

                    // Handle the styled image (replace current content dynamically)
                    if (data.styled_image) {
                        const styledImageContainer = document.createElement('div');
                        styledImageContainer.innerHTML = `
                            <h2>Styled Image:</h2>
                            <img src="${data.styled_image}" alt="Styled Image">
                        `;
                        document.body.appendChild(styledImageContainer);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            });
        });
    </script>
</body>
</html>
